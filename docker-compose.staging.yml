version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: queueless-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: queueless
      POSTGRES_PASSWORD: queueless_staging_password_secure
      POSTGRES_DB: queueless_staging
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c max_connections=200
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100
    ports:
      - "5432:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueless -d queueless_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - queueless-network

  redis:
    image: redis:7-alpine
    container_name: queueless-staging-redis
    restart: unless-stopped
    command: >
      redis-server --appendonly yes
                   --maxmemory 512mb
                   --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - queueless-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: queueless-staging-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://queueless:queueless_staging_password_secure@postgres:5432/queueless_staging?schema=public&connection_limit=25
      REDIS_URL: redis://redis:6379
      JWT_SECRET: queueless_jwt_staging_super_secret_signing_key_2026
      ADMIN_WEB_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - queueless-network

  admin_web:
    build:
      context: ./admin_web
      dockerfile: Dockerfile
    container_name: queueless-staging-admin-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - queueless-network

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local

networks:
  queueless-network:
    driver: bridge
