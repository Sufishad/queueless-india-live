<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QueueLess India — Merchant & Admin Console</title>
    <style>
      body {
        margin: 0;
        background-color: #0B0F19;
        color: #F8FAFC;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .card {
        background-color: #121A2B;
        border: 1px solid #1E293B;
        border-radius: 12px;
        padding: 32px;
        max-width: 480px;
        text-align: center;
      }
      .badge {
        background-color: #F97316;
        color: white;
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
      }
      h1 { font-size: 24px; margin-top: 16px; margin-bottom: 8px; }
      p { color: #94A3B8; font-size: 14px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">QueueLess India Admin</span>
      <h1>Merchant Operations & Branch Console</h1>
      <p>Staging interface connected to live token engine gateway. Full analytics, branch configuration and counter board active.</p>
    </div>
  </body>
</html>
