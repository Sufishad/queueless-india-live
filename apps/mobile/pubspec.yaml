name: queueless_mobile
description: "QueueLess India - Customer & Merchant Live Queue App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Network, Realtime & Storage
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Audio, Notifications & TTS
  flutter_tts: ^4.0.2
  firebase_core: ^2.30.0
  firebase_messaging: ^14.8.0
  audioplayers: ^6.0.0

  # UI, Fonts & Ticket Visuals
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
